<html>
<head>

<style>

  .photo-gallery {
    width: 100vw;
    max-width: 100vw;

    position: relative;
    left: 50%;
    transform: translateX(-50%);

    display: flex;
    flex-direction: column;

    gap: 5px;
    padding: 5px;

    box-sizing: border-box;
  }

  .gallery-row {
    display: flex;
    width: 100%;
    gap: 5px;
  }

  .gallery-item {
    flex: 1;
    min-width: 0;
    overflow: hidden;

    margin: 0;
    padding: 0;
    border: none;
  }

  .gallery-item img {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: cover;

    margin: 0;
    padding: 0;
    border: none;
  }


  @media (max-width: 600px) {

    .photo-gallery {
      gap: 3px;
      padding: 3px;
    }

    .gallery-row {
      gap: 3px;
    }

  }
</style>


<div class="photo-gallery" id="photoGallery">

  <img src="/assets/images/IMG_7674.JPG" alt="">

  <img src="/assets/images/IMG_7674.JPG" alt="">

  <img src="/assets/images/7.5.2 A.JPG" alt="">

  <img src="/assets/images/7.5.2 A.JPG" alt="">
  
  <img src="/assets/images/IMG_7674.JPG" alt="">


</div>


<script>

  const gallery = document.getElementById("photoGallery");

  const TARGET_ROW_HEIGHT = 300;

 GAP = 5;


  function createGallery() {

    const images = Array.from(gallery.querySelectorAll(":scope > img"));

    gallery.innerHTML = "";

    let row = [];
    let rowAspectRatio = 0;

    const galleryWidth = gallery.clientWidth;


    images.forEach((img, index) => {

      const aspectRatio =
        img.naturalWidth / img.naturalHeight;

      row.push({
        img: img,
        ratio: aspectRatio
      });

      rowAspectRatio += aspectRatio;


      const availableWidth =
        galleryWidth -
        GAP * (row.length - 1) -
        10;

      const calculatedHeight =
        availableWidth / rowAspectRatio;


      if (
        calculatedHeight <= TARGET_ROW_HEIGHT ||
        index === images.length - 1
      ) {

        const galleryRow =
          document.createElement("div");

        galleryRow.className = "gallery-row";


        row.forEach(item => {

          const container =
            document.createElement("div");

          container.className =
            "gallery-item";


          container.style.flex =
            `${item.ratio} 1 0%`;


          container.style.height =
            `${calculatedHeight}px`;


          container.appendChild(item.img);

          galleryRow.appendChild(container);

        });


        gallery.appendChild(galleryRow);


        row = [];
        rowAspectRatio = 0;
      }

    });

  }

  function waitForImages() {

    const images =
      Array.from(
        gallery.querySelectorAll("img")
      );


    const promises =
      images.map(img => {

        if (img.complete) {
          return Promise.resolve();
        }

        return new Promise(resolve => {

          img.addEventListener(
            "load",
            resolve,
            { once: true }
          );

          img.addEventListener(
            "error",
            resolve,
            { once: true }
          );

        });

      });


    Promise.all(promises)
      .then(createGallery);

  }


  waitForImages();


  let resizeTimer;

  window.addEventListener("resize", () => {

    clearTimeout(resizeTimer);

    resizeTimer = setTimeout(() => {
      createGallery();
    }, 150);

  });

</script>



</body>
</html>
