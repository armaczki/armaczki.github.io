<html>
<head>

<style>

  html,
  body {
    margin: 0;
    padding: 0;
  }

  .gallery-title {
    width: 100%;
    text-align: center;

    font-size: 40px;
    margin: 20px 0 25px 0;
  }

  .video-gallery {

    width: 100vw;
    max-width: 100vw;

    position: relative;
    left: 50%;
    transform: translateX(-50%);

    display: flex;
    flex-direction: column;

    gap: 5px;
    padding: 5px;

    box-sizing: border-box;
  }

  .gallery-row {

    display: flex;
    width: 100%;

    gap: 5px;
  }

  .gallery-item {

    min-width: 0;

    overflow: hidden;

    margin: 0;
    padding: 0;

    border: none;

    background: transparent;
  }

  .gallery-item video {

    display: block;

    width: 100%;
    height: 100%;

    object-fit: cover;

    margin: 0;
    padding: 0;

    border: none;

    background: transparent;
  }


  @media (max-width: 600px) {

    .video-gallery {

      gap: 3px;
      padding: 3px;
    }

    .gallery-row {

      gap: 3px;
    }

    .gallery-title {

      font-size: 30px;
      margin-bottom: 15px;
    }

</head>


<body>


<h1 class="gallery-title">
  Animations
</h1>


<div class="video-gallery" id="videoGallery">

  <video controls preload="metadata">

    <source
      src="https://github.com/armaczki/armaczki.github.io/raw/refs/heads/master/assets/videos/0001-1000.mp4"
      type="video/mp4"
    >

    Your browser does not support the video tag.

  </video>

  <video controls preload="metadata">

    <source
      src="https://github.com/armaczki/armaczki.github.io/raw/refs/heads/master/assets/videos/0001-0600.mp4"
      type="video/mp4"
    >

    Your browser does not support the video tag.

  </video>


</div>


<script>

document.addEventListener("DOMContentLoaded", function () {


  const gallery =
    document.getElementById("videoGallery");

  const videos =
    Array.from(
      gallery.querySelectorAll(":scope > video")
    );


  const TARGET_HEIGHT = 300;

  const GAP = 5;

  function buildGallery() {


    const galleryWidth =
      gallery.clientWidth;


    if (
      !galleryWidth ||
      galleryWidth < 10
    ) {
      return;
    }

    gallery.innerHTML = "";


    let row = [];

    let aspectRatioSum = 0;



    videos.forEach(function (video, index) {

      let ratio = 16 / 9;


      if (
        video.videoWidth &&
        video.videoHeight
      ) {

        ratio =
          video.videoWidth /
          video.videoHeight;

      }


      row.push({

        video: video,

        ratio: ratio

      });


      aspectRatioSum += ratio;

      const availableWidth =

        galleryWidth -
        GAP * (row.length - 1);


      const rowHeight =

        availableWidth /
        aspectRatioSum;

      if (

        rowHeight <= TARGET_HEIGHT ||

        index === videos.length - 1

      ) {


        const rowElement =
          document.createElement("div");


        rowElement.className =
          "gallery-row";



        row.forEach(function (item) {


          const itemElement =
            document.createElement("div");


          itemElement.className =
            "gallery-item";


          itemElement.style.flex =
            item.ratio + " 1 0";


          itemElement.style.height =
            rowHeight + "px";



          itemElement.appendChild(
            item.video
          );


          rowElement.appendChild(
            itemElement
          );

        });



        gallery.appendChild(
          rowElement
        );

        row = [];

        aspectRatioSum = 0;

      }

    });

  }

  let loaded = 0;


  function videoReady() {

    loaded++;


    if (
      loaded === videos.length
    ) {

      buildGallery();

    }

  }



  videos.forEach(function (video) {


    if (
      video.readyState >= 1
    ) {

      videoReady();

    }

    else {

      video.addEventListener(
        "loadedmetadata",
        videoReady,
        { once: true }
      );


      video.addEventListener(
        "error",
        videoReady,
        { once: true }
      );

    }

  });


  let resizeTimer;


  window.addEventListener(
    "resize",
    function () {


      clearTimeout(
        resizeTimer
      );


      resizeTimer =
        setTimeout(
          function () {

            buildGallery();

          },
          200
        );

    }
  );

});

</script>


</body>
</html>
